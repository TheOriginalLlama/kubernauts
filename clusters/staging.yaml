# Staging cluster definition. CI builds an ephemeral copy of this for every test run.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubernauts-staging
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8082
        protocol: TCP
  - role: worker
